name: daily-weather
version: 1

# ── 触发 ──
trigger:
  schedule: "0 23 * * *"    # UTC 23:00 = 北京 7:00

# ── 数据桥 ──
bridge:
  type: git
  repo: sunzcdev/data-bridge
  path: daily-weather/

# ── 步骤 ──
steps:
  # 1. GHA 采集天气
  - id: weather
    runner: gha
    action:
      type: http
      url: "https://api.openweathermap.org/data/2.5/weather?q=Zhengzhou&appid={{ secrets.OWM_KEY }}&units=metric&lang=zh_cn"

  # 2. GHA LLM 生成寄语（读取 weather.json 作为上下文）
  - id: greet
    runner: gha
    depends: [weather]
    action:
      type: llm
      model: qwen2.5-32b
      prompt: "你是一个早安助手。根据以下天气数据写一句温暖早安寄语（20字内）。\n\n天气数据：\n$(cat data/weather.json)"

  # 3. GHA 推送数据到桥仓库
  - id: push
    runner: gha
    depends: [greet]
    action:
      type: git
      commit: "daily-weather update"

  # 4. GHA 邮件通知（可选）
  - id: notify
    runner: gha
    optional: true
    depends: [greet]
    action:
      type: email
      to: "sunzcdev@gmail.com"
      subject: "早安 🌤"
      body_file: "data/greet.json"

  # 5. 本地写入 Obsidian
  - id: write-diary
    runner: local
    trigger: git_push
    action:
      type: obsidian
      template: templates/weather-snippet.md
      data: "data/weather.json"

  # 6. 本地微信推送
  - id: wechat-push
    runner: local
    depends: [write-diary]
    action:
      type: wechat
      content: "早安，今日天气数据已更新！"
