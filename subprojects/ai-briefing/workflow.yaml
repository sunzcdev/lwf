# LWF 工作流定义 — ai-briefing
# 模式检测 → 采集 → LLM 精选 → Git 桥存储 → 邮件推送
name: ai-briefing
trigger:
  schedule: "0 7 * * *"        # 每天 UTC 7:00（北京时间 15:00）

bridge:
  repo: sunzcdev/data-bridge
  path: ai-briefing/

steps:
  # ── 第一步：模式检测（daily/weekly/monthly） ──
  - id: detect
    runner: gha
    capability: detect
    using: script
    config:
      file: scripts/detect-mode.sh

  # ── 第二步：采集 ──
  - id: collect
    runner: gha
    depends: [detect]
    capability: collect
    using: script
    config:
      file: scripts/collect.py
      args: ${{ steps.detect.outputs.mode }}
      env:
        GITHUB_TOKEN: "{{ secrets.GITHUB_TOKEN }}"

  # ── 第三步：LLM 精选 ──
  - id: digest
    runner: gha
    depends: [collect]
    capability: process
    using: llm
    config:
      model: "Qwen/Qwen2.5-32B-Instruct"
      api_url: "https://api.siliconflow.cn/v1/chat/completions"
      prompt: "你是 AI 领域资深编辑。从候选项目中挑出 7 个最值得关注的优质项目，从候选新闻中挑出 3 个最重要热点，每项用一句话中文点评。"

  # ── 第四步：存入数据桥 ──
  - id: store
    runner: gha
    depends: [digest]
    capability: store
    using: git
    config:
      commit_message: "ai-briefing update"

  # ── 第五步：渲染发信 ──
  - id: send
    runner: gha
    depends: [digest]
    capability: process
    using: script
    config:
      file: scripts/send.py
      env:
        QQ_SMTP_PASS: "{{ secrets.QQ_SMTP_PASS }}"
        EMAIL_TO: "{{ secrets.EMAIL_TO }}"
